name: "CI - Documentation & Code Quality"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-scripts:
    name: "Lint & Validate Shell Scripts"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run ShellCheck on scripts"
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: "warning"

  validate-markdown-links:
    name: "Check Markdown Internal Links"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Check Markdown Internal Links"
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline "**/*.md"
          fail: true

  validate-cpp-and-docker:
    name: "Validate C++ Code & Dockerfile"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate Dockerfile Lint"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "docker/Dockerfile.rknn"
          failure-threshold: "error"

      - name: "Cross-Compile C++ GPIO Example for ARM64"
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome*
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu
          mkdir -p /tmp/wiringpi_mock
          cat << 'EOF' > /tmp/wiringpi_mock/wiringPi.h
          #pragma once
          #define OUTPUT 1
          #define INPUT 0
          #define PUD_UP 2
          #define HIGH 1
          #define LOW 0
          inline int wiringPiSetup(void) { return 0; }
          inline void pinMode(int, int) {}
          inline void pullUpDnControl(int, int) {}
          inline void digitalWrite(int, int) {}
          inline int digitalRead(int) { return 0; }
          EOF
          aarch64-linux-gnu-g++ -Wall -Wextra -std=c++17 -O2 -I/tmp/wiringpi_mock examples/gpio_cpp/src/main.cpp -c -o /tmp/gpio_arm64.o
          file /tmp/gpio_arm64.o
          echo "ARM64 Cross-Compilation Successful!"
